spring:
  # 敏感信息统一从环境变量或项目根目录下的 .env 文件读取（.env 已被 .gitignore 忽略）
  # 本地开发：复制 .env.example 为 .env 并填入真实值；线上部署：直接注入环境变量
  config:
    import: "optional:file:./.env[.properties]"

  # 配置数据源
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/vibe_music?useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false # 修改你的 MySQL 地址和库名
    type: com.alibaba.druid.pool.DruidDataSource # 配置连接池
    username: ${MYSQL_USERNAME:root} # 环境变量 MYSQL_USERNAME
    password: ${MYSQL_PASSWORD:} # 环境变量 MYSQL_PASSWORD，禁止在此写明文密码

  # Redis服务连接配置
  data:
    redis:
      database: 1
      host: 127.0.0.1
      port: 6379

  servlet:
    multipart:
      max-file-size: 200MB # 单文件硬上限，与 MediaPolicy.MAX_AUDIO_BYTES 保持一致
      max-request-size: 1100MB # 50 首音频合计 1 GB，另留封面与 multipart 开销

  # 对于注解的Redis缓存数据统一设置有效期为10分钟，单位毫秒
  cache:
    redis:
      time-to-live: 600000

  # 配置邮件服务
  mail:
    # 配置邮箱账户和密码
    host: smtp.qq.com # 修改你的 SMTP 服务器地址
    username: ${MAIL_USERNAME:} # 环境变量 MAIL_USERNAME，发件邮箱账号
    password: ${MAIL_PASSWORD:} # 环境变量 MAIL_PASSWORD，邮箱授权码，禁止在此写明文
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
          # 邮件服务超时时间配置
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

# 配置 mybatis-plus
mybatis-plus:
  type-aliases-package: cn.edu.seig.pojo # 实体类所在的包，允许用实体类类名作为别名

  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl # 避免 SQL 参数泄露密码和聊天内容
    map-underscore-to-camel-case: true # 类属性与表字段的驼峰映射

  global-config:
    db-config: # 数据库配置
      table-prefix: tb_  # 表名前缀为tb_，表名为前缀连接类名（小写）

# 定义角色和路径权限的映射关系
role-path-permissions:
  permissions:
    ROLE_ADMIN:
      - "/admin/"
    ROLE_USER:
      - "/user/"
      - "/playlist/"
      - "/artist/"
      - "/song/"
      - "/album/"
      - "/favorite/"
      - "/play-history/"
      - "/comment/"
      - "/banner/"
      - "/feedback/"
      - "/ai/"
      - "/search"

minio:
  endpoint: http://127.0.0.1:9005 # 修改你的 MinIO 端点
  accessKey: ${MINIO_ACCESS_KEY:} # 环境变量 MINIO_ACCESS_KEY
  secretKey: ${MINIO_SECRET_KEY:} # 环境变量 MINIO_SECRET_KEY
  bucket: vibe-music-data # 确认 Bucket 名称与你创建的一致
server:
  port: 8080

logging:
  level:
    com.heima: debug

# LangChain4j DashScope 配置
langchain4j:
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:} # 环境变量 DASHSCOPE_API_KEY，禁止在此写明文 Key
    model-name: qwen-flash

# 歌词补全配置
lyrics:
  enabled: true # 总开关，关闭后所有歌词抓取接口直接返回不可用
  proxy: ${LYRICS_PROXY:} # 可选代理（如 http://127.0.0.1:8080），留空表示直连
  match:
    min-score: 0.7 # 匹配得分阈值，低于该值视为无匹配，宁可不写
    duration-tolerance-seconds: 3 # 时长容差（秒）
  providers:
    # 主源：QQ 音乐，一次请求返回歌词 + 词/曲/编曲
    qq:
      enabled: true
      base-url: https://c.y.qq.com
      referer: https://y.qq.com/portal/player.html
      user-agent: VibeMusic/1.0 (https://github.com/jakehatelov333/music)
      connect-timeout-ms: 3000
      read-timeout-ms: 8000
      max-retries: 2
    # 兜底：LRCLIB，公开开放接口，但无词曲作者信息
    lrclib:
      enabled: true
      base-url: https://lrclib.net
      user-agent: VibeMusic/1.0 (https://github.com/jakehatelov333/music)
      connect-timeout-ms: 3000
      read-timeout-ms: 8000
      max-retries: 2
  batch:
    thread-pool-size: 2 # 并发刻意保持很低，节流靠 delay-ms
    queue-capacity: 200
    delay-ms: 500 # 每首歌曲之间的间隔，避免触发数据源限流
    max-task-size: 1000 # 单次批量任务最多处理多少首
    task-ttl-hours: 24 # 任务状态在 Redis 中的保留时长

# AI 单次任务限制；每日和分钟配额见 RateLimitInterceptor。
ai:
  timeout-seconds: 60
  # 从 4 提到 6：注入用户画像后，合法流程需要更多检索（例如"按我的偏好推荐"要查 1~2 个风格
  # 或歌手）。原值 4 是在"无画像"时代定的，实测会让这类提问以 TOOL_ERROR 失败。
  # 再从 6 提到 10：助手是 ReAct 循环，"这条路查不到就换一条"本来就是正常行为，
  # 而每次尝试至少花 1 次工具调用。6 次只够走完一条直线，遇到空结果（条件交集过窄、
  # 某位歌手缺风格标注）就没有余量调整方向，只能把"没找到"转述给用户。
  # 注意：这里放开的是**探索次数**，不是约束强度 —— 用户偏好里的排除条件仍然在 SQL 层生效。
  max-tool-calls: 10
  max-output-tokens: 512
  # 采样温度。助手是"如实转述服务端事实 + 简短判断"，不需要创作性发散。
  # 实测同一段对话里同样的工具返回两轮给出两种语气，其中一轮把"模型自行筛选"
  # 说成了"系统已过滤"。压低温度减少这类措辞漂移；要更活泼的文案请改提示词。
  temperature: 0.3
  # 待确认任务有效期：超时后不可再确认，也不会执行。
  pending-action-ttl-minutes: 30
  # 选曲去重：读取当前用户在当前会话最近 N 条创建歌单预览，把其中用过的歌曲
  # 交给候选检索工具在 SQL 层排除，避免连续创建同类歌单时整组歌曲重复。
  # 只按 (user_id, chat_id) 限定并带 LIMIT，不会加载用户全部历史。
  playlist-history:
    lookback: 5
  pending-action-sweep-initial-delay-ms: 60000
  pending-action-sweep-interval-ms: 300000
  # 用户画像：事实来自收藏与自建歌单（暂无播放历史表）。
  profile:
    refresh-ttl-minutes: 10 # 画像事实的刷新间隔；TTL 内直接读库（请求路径零模型调用）
    top-n: 5 # 风格/歌手各取 TOP N
    summary-max-chars: 300 # qwen-flash 偏好概述的长度上限；事实指纹不变则不重新生成
  # 摘要记忆：窗口之外的历史压缩成常驻摘要，注入动态系统提示词。
  summary:
    enabled: true
    trigger-messages: 40 # 未被摘要覆盖的消息超过此数才触发（窗口为 20 条）
    chunk-messages: 20 # 每次压缩最早的一段
    max-chars: 300 # 摘要长度上限
  # 多会话：「最近对话」列表一次最多返回多少条，同时也是 limit 参数的上限。
  # 会话多起来之后的「加载更多」留到后续版本，第一版只保证最近若干条。
  conversation:
    list-limit: 20
  # AI 记忆与手动偏好（tb_user_memory_preference / tb_user_ai_memory_setting）。
  memory:
    max-preferences-per-category: 50 # 单个用户单个分类的手动偏好上限
  # AI 可观测性（Trace / Span）。详见 docs/ai-observability.md。
  # 采集是旁路能力：任何采集异常都只计数 + 记日志，绝不影响用户回复。
  trace:
    enabled: true # 总开关；关闭后不再产生 Trace 明细（指标表不受影响）
    capture-content: true # 是否保存消息正文、提示词、工具返回；关闭后只留元数据与统计
    max-text-chars: 4000 # 单条消息 / 单段文本上限
    max-system-prompt-chars: 40000 # 系统提示词上限（基础提示词本身就有数千字）
    max-tools-chars: 60000 # 工具定义上限（10 个工具的中文描述合计超过一万字符是正常的）
    max-messages-chars: 60000 # 单次模型调用输入快照上限
    max-result-chars: 20000 # 工具返回数据上限
    retention-days: 30 # 保留天数，超期由 AiTraceRetentionTask 清理；<=0 表示不清理
    cleanup-initial-delay-ms: 300000
    cleanup-interval-ms: 86400000
  # 费用估算（估算，不是供应商账单）。
  # 官方来源：https://help.aliyun.com/zh/model-studio/model-pricing
  # 查询日期：2026-10-24；页面更新时间：2026-10-22 11:52:55 +08:00。
  # 默认接入地域为华北 2（北京），qwen-flash 标准实时原价：
  #   0 < 单次输入 Token <= 128K：输入 0.15 / 输出 1.5 元每百万 Token
  #   128K < 单次输入 Token <= 256K：输入 0.6 / 输出 6 元每百万 Token
  #   256K < 单次输入 Token <= 1M：输入 1.2 / 输出 12 元每百万 Token
  # 所有 Token 按该次请求命中的档位结算；不含 Batch 半价、上下文缓存折扣、
  # 免费额度与活动优惠。超出 1M 的调用不估算，绝不按最高档外推。
  cost:
    currency: CNY
    price-version: qwen-flash-cn-beijing-2026-10-22
    source-url: https://help.aliyun.com/zh/model-studio/model-pricing
    source-updated-at: "2026-10-22 11:52:55 +08:00"
    tiers:
      - max-input-tokens: 128000
        input-price-per-million: 0.15
        output-price-per-million: 1.5
      - max-input-tokens: 256000
        input-price-per-million: 0.6
        output-price-per-million: 6
      - max-input-tokens: 1000000
        input-price-per-million: 1.2
        output-price-per-million: 12
    # 兼容旧部署的单一单价配置；配置了 tiers 后不使用这两项。
    input-price-per-million:
    output-price-per-million:

# 跨域凭据只允许明确列出的前端来源；部署时填写实际域名。
app:
  jwt:
    # 生产环境必须通过 JWT_SECRET 注入至少 32 字节的随机密钥；未配置时仅非生产环境生成临时密钥。
    secret: ${JWT_SECRET:}
    ttl-hours: 6
  admin-init:
    # 仅用于首次受控初始化；用户名已存在时不会覆盖现有密码。
    username: ${ADMIN_INIT_USERNAME:}
    password: ${ADMIN_INIT_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8090,http://localhost:8089,http://127.0.0.1:8090,http://127.0.0.1:8089}

# 专辑上传会话（草稿箱）配置
album-upload:
  # 草稿在 Redis 中的存活小时数，也是前端展示「剩余时间」的依据。
  # 签约/完成单个文件会续期，因此实际窗口从最后一次上传动作重新计算。
  # 超时后草稿不可恢复，暂存文件由每小时的 AlbumUploadCleanupTask 回收。
  session-ttl-hours: 12
