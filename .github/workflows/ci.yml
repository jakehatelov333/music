name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 后端构建 + 自动化测试 + Agent 评测
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe-music-server
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 构建并运行全部测试（含 46 条 Agent 离线评测）
        # 测试使用 H2 内存库（MySQL 兼容模式）+ 脚本化模型替身，
        # 不依赖 MySQL / Redis / MinIO / DashScope，可在 CI 中稳定重复执行。
        # AgentEvalReportTest 会在断言失败时让构建失败，即“评测进 CI”。
        run: mvn -B -ntp verify

      - name: 上传 Agent 评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report
          path: |
            vibe-music-server/target/agent-eval/report.md
            vibe-music-server/target/agent-eval/report.json
          if-no-files-found: warn

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: vibe-music-server/target/surefire-reports/
          if-no-files-found: warn

  client:
    name: 用户端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe-music-client
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: vibe-music-client/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 类型检查放在构建之前：构建不跑 vue-tsc，历史上有 5 个类型错误长期潜伏
      # （未使用变量、hexToRgb 的 void 返回契约），只因 CI 不检查才一直没被发现。
      - name: 类型检查
        run: pnpm type-check

      - name: 生产构建
        run: pnpm build

  admin:
    name: 管理端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe-music-admin
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: vibe-music-admin/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生产构建
        run: pnpm build

  # 可选：真实模型端到端评测。需要仓库 Secret DASHSCOPE_API_KEY，默认不跑，
  # 避免每次 PR 都产生付费调用。手动触发 workflow_dispatch 时可选执行。
  online-eval:
    name: 真实模型端到端评测（可选，需 DASHSCOPE_API_KEY）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibe-music-server
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 检查密钥是否配置
        id: secret
        run: |
          if [ -z "${{ secrets.DASHSCOPE_API_KEY }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 真实模型端到端评测
        if: steps.secret.outputs.configured == 'true'
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          AI_EVAL_ONLINE: '1'
        run: mvn -B -ntp test -Dtest=AgentEvalReportTest -Donline=true

      - name: 未配置密钥时的说明
        if: steps.secret.outputs.configured != 'true'
        run: echo "未配置 DASHSCOPE_API_KEY，跳过真实模型端到端评测（标记为未执行）。"
